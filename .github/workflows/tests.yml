name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate skill and plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent Skills spec (skills-ref)
        run: |
          pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          skills-ref validate skills/pdf-to-clean-text
      - name: Plugin manifests are valid JSON
        run: python -m json.tool .claude-plugin/marketplace.json > /dev/null && python -m json.tool .claude-plugin/plugin.json > /dev/null

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # GitHub's runners have no GPU. docling's default "auto" picks Apple's MPS on macOS, which inside a
      # virtual machine gave wrong layout results and a failing table stage; CPU is what these runners have.
      DOCLING_DEVICE: cpu
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/pdf-to-clean-text/requirements.txt
      # The default Linux wheels bundle CUDA (several GB). torch and torchvision must come from the same
      # index: torchvision from PyPI paired with a CPU torch fails with "operator torchvision::nms does not exist".
      - name: Install CPU-only torch and torchvision on Linux
        if: runner.os == 'Linux'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Cache docling's models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('skills/pdf-to-clean-text/requirements.txt') }}
      - run: pytest -q
