name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate skill and plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent Skills spec (skills-ref)
        run: |
          pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          skills-ref validate skills/pdf-to-clean-text
      - name: Plugin manifests are valid JSON
        run: python -m json.tool .claude-plugin/marketplace.json > /dev/null && python -m json.tool .claude-plugin/plugin.json > /dev/null

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/pdf-to-clean-text/requirements.txt
      - name: Install CPU-only torch on Linux (the default wheel bundles CUDA, several GB)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Cache docling's models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('skills/pdf-to-clean-text/requirements.txt') }}
      - run: pytest -q
